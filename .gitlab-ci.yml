# GitLab CI configuration for hostenv
#
# This runs Nix flake checks on every merge request and push to main
# to ensure code quality and prevent regressions.

image: nixos/nix:latest

variables:
  NIX_CONFIG: "experimental-features = nix-command flakes"

# Enable Nix flakes and configure binary cache
before_script:
  - nix profile add --accept-flake-config nixpkgs#cachix
  - cachix use fossar
  - cachix use hostenv

stages:
  - check

.nix-failure-artifacts:
  after_script:
    - |
        nix_build_dir=/nix/var/nix/builds
        artifact_dir="$CI_PROJECT_DIR/nix-build-artifacts"

        mkdir -p "$artifact_dir/builds"
        {
          echo "CI job status: ${CI_JOB_STATUS:-unknown}"
          echo "Nix build directory: $nix_build_dir"

          if [ -d "$nix_build_dir" ]; then
            ls -la "$nix_build_dir"
            if cp -a "$nix_build_dir"/. "$artifact_dir/builds"/; then
              echo "Copied retained Nix build directories into the artifact directory."
            else
              echo "WARNING: Some retained Nix build files could not be copied."
            fi
          else
            echo "The Nix build directory does not exist."
          fi
        } > "$artifact_dir/inventory.txt" 2>&1
        cat "$artifact_dir/inventory.txt"
  artifacts:
    when: on_failure
    paths:
      - nix-build-artifacts/

# Job: Run nix flake check
# This validates flake structure and runs all checks defined in checks.*
flake-check:
  extends: .nix-failure-artifacts
  stage: check
  # Cachix's auth token variable is 'protected', so it's not available for
  # unprotected branches in gitlab
  script:
    - |
        if [ -n "${CACHIX_AUTH_TOKEN:-}" ]; then
          cachix watch-exec hostenv -- nix flake check --show-trace --print-build-logs --keep-failed
        else
          echo "Cachix write token unavailable; running without cache uploads"
          nix flake check --show-trace --print-build-logs --keep-failed
        fi
  rules:
    - if: '$CI_MERGE_REQUEST_DRAFT == true'
      when: never
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == "main"'
  tags:
    - saas-linux-small-arm64

# Nightly updates and builds.
# Note: to start updates are run nightly and are automatically committed to
# main, this will hold while the project is in early development, however,
# this should change as hostenv matures.
#
# Further into the project we will slow the cadence (to weekly updates?),
# use a stable version of nixpkgs, and move to using MRs for updates instead
# of slinging changes onto main.
#
# It's worth noting that downstream projects won't especially be affected by
# these updates as they have their own `flake.lock` files that lock nixpkgs.
nightly-full-check:
  extends: .nix-failure-artifacts
  stage: check
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
  script:
    - |
        set -euo pipefail
        git checkout main
        nix flake update
        if ! git diff --quiet --exit-code; then
          cachix watch-exec hostenv -- nix flake check --show-trace --print-build-logs --keep-failed
          git config --global user.name "Patch Bot"
          git config --global user.email "patch-bot@hostenv.sh"
          git commit -m "(chore) update flake.lock dependencies" flake.lock
          git push "https://SelfCI:${GITLAB_TOKEN}@${CI_SERVER_HOST}/${CI_PROJECT_PATH}.git"
        else
          echo "No updates available"
        fi
  tags:
    - saas-linux-small-arm64
  allow_failure: true
